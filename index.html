<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noddyy Notification Log</title>
<style>
  :root {
    --accent: #7C3AED;
    --accent-soft: #F3EEFF;
    --ink: #18181B;
    --muted: #71717A;
    --line: #E4E4E7;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --helpers: #0F766E;
    --helpers-soft: #E6F4F1;
    --tap: 44px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 14px 56px;
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
  }

  h1 { font-size: 20px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.01em; }

  .count { color: var(--muted); font-size: 14px; margin: 0; }

  .status {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-top: 10px; font-size: 13px; color: var(--muted);
  }

  button, input {
    font: inherit;
    font-size: 16px; /* keeps iOS from zooming on focus */
  }

  button {
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    min-height: var(--tap);
    transition: background .15s, border-color .15s, color .15s;
  }

  .refresh { padding: 0 16px; font-size: 14px; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh[disabled] { opacity: .55; cursor: default; }

  /* Sticky control bar: day navigation stays reachable while scrolling */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 10px 0 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .daynav { display: flex; align-items: center; gap: 8px; }

  .arrow {
    flex: 0 0 var(--tap);
    min-width: var(--tap);
    height: var(--tap);
    font-size: 20px;
    line-height: 1;
    color: var(--muted);
  }
  .arrow:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  .arrow[disabled] { opacity: .35; cursor: default; }

  .datefield {
    flex: 1 1 auto;
    min-width: 0;
    min-height: var(--tap);
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    text-align: center;
  }

  .today {
    flex: 0 0 auto;
    padding: 0 16px;
    font-size: 14px;
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .today[disabled] { opacity: .4; background: var(--card); border-color: var(--line); color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .chip { padding: 0 14px; min-height: 38px; font-size: 14px; color: var(--muted); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .banner {
    background: var(--accent-soft);
    border: 1px solid #DDD0FB;
    color: #5B21B6;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14px;
    margin-bottom: 14px;
  }

  .group { margin-bottom: 24px; }

  .group-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
    padding-bottom: 8px; margin: 0 0 12px;
    border-bottom: 1px solid var(--line);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .card-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

  .time {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.helpers { background: var(--helpers-soft); color: var(--helpers); }

  .slot { font-size: 12px; color: var(--muted); }

  /* Full-width tap target on phones, inline on wider screens */
  .copy {
    width: 100%;
    padding: 0 14px;
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy.done { border-color: var(--accent); background: var(--accent); color: #fff; }

  .title { font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }

  .desc { color: #3F3F46; overflow-wrap: anywhere; }

  .lang { display: flex; gap: 8px; margin-top: 5px; }
  .lang-tag {
    flex: 0 0 26px; font-size: 10px; font-weight: 700;
    color: var(--muted); letter-spacing: .04em; padding-top: 4px;
  }

  .hook {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px dashed var(--line);
    font-size: 12px; color: var(--muted); overflow-wrap: anywhere;
  }

  .notice {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 18px; text-align: center; color: var(--muted);
  }

  .error {
    background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C;
    border-radius: 10px; padding: 10px 13px; font-size: 14px; margin-bottom: 14px;
  }

  [hidden] { display: none !important; }

  @media (min-width: 560px) {
    .copy { width: auto; margin-top: 0; margin-left: auto; min-height: 36px; }
  }

  @media (min-width: 640px) {
    .wrap { padding: 28px 24px 64px; }
    h1 { font-size: 25px; }
    .card { padding: 16px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Noddyy Notification Log</h1>
    <p class="count" id="count">Loading…</p>
    <div class="status">
      <span id="updated">—</span>
      <button class="refresh" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="bar">
    <div class="daynav">
      <button class="arrow" id="prev" type="button" aria-label="Previous day with notifications">‹</button>
      <input class="datefield" id="date" type="date" aria-label="Choose a date">
      <button class="arrow" id="next" type="button" aria-label="Next day with notifications">›</button>
      <button class="today" id="todayBtn" type="button">Today</button>
    </div>

    <div class="chips" id="filter-audience" role="group" aria-label="Filter by audience">
      <button class="chip" type="button" data-value="All" aria-pressed="true">All</button>
      <button class="chip" type="button" data-value="Users" aria-pressed="false">Users</button>
      <button class="chip" type="button" data-value="Helpers" aria-pressed="false">Helpers</button>
    </div>

    <div class="chips" id="filter-run" role="group" aria-label="Filter by run">
      <button class="chip" type="button" data-value="All" aria-pressed="true">All</button>
      <button class="chip" type="button" data-value="Morning" aria-pressed="false">Morning</button>
      <button class="chip" type="button" data-value="Evening" aria-pressed="false">Evening</button>
    </div>
  </div>

  <div class="error" id="error" hidden></div>
  <div class="banner" id="banner" hidden></div>

  <main id="list" aria-live="polite"></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     SEND TIMES  --  edit these four values to match when each slot
     actually goes out. 24-hour "HH:MM".

     If a "Time" column is ever added to notifications-log.csv, the value
     in the row wins and this table is only used as a fallback.
     ------------------------------------------------------------------ */
  var SEND_TIMES = {
    'Morning|1': '08:00',
    'Morning|2': '10:00',
    'Evening|1': '18:00',
    'Evening|2': '20:00'
  };

  var CSV_URL = './notifications-log.csv';
  var REFRESH_MS = 5 * 60 * 1000;

  var rows = [];
  var dates = [];            // ascending list of dates that have rows
  var selectedDate = null;
  var userPicked = false;    // once you choose a date, refreshes stop moving you
  var filters = { audience: 'All', run: 'All' };

  var els = {
    count: document.getElementById('count'),
    updated: document.getElementById('updated'),
    refresh: document.getElementById('refresh'),
    error: document.getElementById('error'),
    banner: document.getElementById('banner'),
    list: document.getElementById('list'),
    date: document.getElementById('date'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    todayBtn: document.getElementById('todayBtn')
  };

  /* ---------- helpers ---------- */

  function text(v) { return v === null || v === undefined ? '' : String(v).trim(); }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' +
           (day.length < 2 ? '0' + day : day);
  }

  // Built from Y/M/D parts so the date is never shifted by UTC parsing.
  function prettyDate(iso) {
    var p = iso.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    });
  }

  function prettyTime(hhmm) {
    if (!/^\d{1,2}:\d{2}$/.test(hhmm)) return '';
    var parts = hhmm.split(':');
    var h = Number(parts[0]);
    var m = parts[1];
    if (h < 0 || h > 23) return '';
    var suffix = h < 12 ? 'AM' : 'PM';
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + suffix;
  }

  function rowTime(row) {
    if (row.time && /^\d{1,2}:\d{2}/.test(row.time)) return row.time.slice(0, 5);
    return SEND_TIMES[row.run + '|' + row.slot] || '';
  }

  function showError(msg) { els.error.textContent = msg; els.error.hidden = false; }
  function clearError() { els.error.hidden = true; els.error.textContent = ''; }

  // Anything we cannot render meaningfully is skipped, never rendered broken.
  function normalise(raw) {
    if (!raw || typeof raw !== 'object') return null;

    var date = text(raw['Date']);
    var run = text(raw['Run']);
    var audience = text(raw['Audience']);
    var title = text(raw['Title']);

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    if (!/^(morning|evening)$/i.test(run)) return null;
    if (!/^(users|helpers)$/i.test(audience)) return null;
    if (!title) return null;

    var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); };

    return {
      date: date,
      run: cap(run),
      audience: cap(audience),
      slot: text(raw['Slot']),
      time: text(raw['Time']),   // optional column, absent today
      title: title,
      en: text(raw['Description EN']),
      hi: text(raw['Description HI']),
      te: text(raw['Description TE']),
      hook: text(raw['Context Hook'])
    };
  }

  function stamp() {
    els.updated.textContent = 'Updated ' + new Date().toLocaleTimeString([], {
      hour: '2-digit', minute: '2-digit'
    });
  }

  /* ---------- copy ---------- */

  function copyText(value) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(value).then(
        function () { return true; },
        function () { return legacyCopy(value); }
      );
    }
    return Promise.resolve(legacyCopy(value));
  }

  function legacyCopy(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  /* ---------- rendering ---------- */

  function langLine(tag, value) {
    var line = document.createElement('div');
    line.className = 'lang';
    var label = document.createElement('span');
    label.className = 'lang-tag';
    label.textContent = tag;
    var body = document.createElement('span');
    body.className = 'desc';
    body.textContent = value;
    line.appendChild(label);
    line.appendChild(body);
    return line;
  }

  function buildCard(row) {
    var card = document.createElement('article');
    card.className = 'card';

    var top = document.createElement('div');
    top.className = 'card-top';

    var t = prettyTime(rowTime(row));
    if (t) {
      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = t;
      top.appendChild(time);
    }

    var badge = document.createElement('span');
    badge.className = 'badge' + (row.audience === 'Helpers' ? ' helpers' : '');
    badge.textContent = row.audience;
    top.appendChild(badge);

    if (row.slot) {
      var slot = document.createElement('span');
      slot.className = 'slot';
      slot.textContent = 'Slot ' + row.slot;
      top.appendChild(slot);
    }

    var btn = document.createElement('button');
    btn.className = 'copy';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      var payload = 'Title: ' + row.title + ' / Description: ' + row.en;
      copyText(payload).then(function (ok) {
        if (!ok) return;
        btn.textContent = 'Copied ✓';
        btn.classList.add('done');
        setTimeout(function () {
          btn.textContent = 'Copy';
          btn.classList.remove('done');
        }, 1400);
      });
    });
    top.appendChild(btn);

    card.appendChild(top);

    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = row.title;
    card.appendChild(title);

    if (row.audience === 'Helpers') {
      [['EN', row.en], ['HI', row.hi], ['TE', row.te]].forEach(function (pair) {
        if (pair[1]) card.appendChild(langLine(pair[0], pair[1]));
      });
    } else if (row.en) {
      var only = document.createElement('div');
      only.className = 'desc';
      only.textContent = row.en;
      card.appendChild(only);
    }

    if (row.hook) {
      var hook = document.createElement('div');
      hook.className = 'hook';
      hook.textContent = row.hook;
      card.appendChild(hook);
    }

    return card;
  }

  function dayRows(date) {
    return rows.filter(function (r) {
      if (r.date !== date) return false;
      if (filters.audience !== 'All' && r.audience !== filters.audience) return false;
      if (filters.run !== 'All' && r.run !== filters.run) return false;
      return true;
    });
  }

  function syncControls() {
    els.date.value = selectedDate || '';
    if (dates.length) {
      els.date.min = dates[0];
      els.date.max = dates[dates.length - 1];
    }
    var i = dates.indexOf(selectedDate);
    els.prev.disabled = !(i > 0);
    els.next.disabled = !(i > -1 && i < dates.length - 1);
    els.todayBtn.disabled = (selectedDate === todayISO());
  }

  function render() {
    els.list.textContent = '';
    els.banner.hidden = true;

    if (!rows.length) {
      els.count.textContent = '—';
      var none = document.createElement('div');
      none.className = 'notice';
      none.textContent = 'No notifications logged yet.';
      els.list.appendChild(none);
      syncControls();
      return;
    }

    var today = todayISO();
    if (selectedDate !== today && dates.indexOf(today) === -1 && !userPicked) {
      // Today has produced nothing yet, so fall back to the most recent day
      // rather than showing a blank page that looks broken.
      els.banner.textContent = 'No runs logged today yet — showing ' +
        prettyDate(selectedDate) + '.';
      els.banner.hidden = false;
    }

    var shown = dayRows(selectedDate);
    var totalForDay = rows.filter(function (r) { return r.date === selectedDate; }).length;

    els.count.textContent = shown.length === totalForDay
      ? totalForDay + ' on ' + prettyDate(selectedDate) + ' · ' + rows.length + ' logged'
      : shown.length + ' of ' + totalForDay + ' on ' + prettyDate(selectedDate) +
        ' · ' + rows.length + ' logged';

    syncControls();

    if (!shown.length) {
      var empty = document.createElement('div');
      empty.className = 'notice';
      empty.textContent = totalForDay
        ? 'No notifications match these filters on this day.'
        : 'No notifications logged on ' + prettyDate(selectedDate) + '.';
      els.list.appendChild(empty);
      return;
    }

    // Chronological within the day: Morning before Evening, then by send time.
    ['Morning', 'Evening'].forEach(function (run) {
      var group = shown.filter(function (r) { return r.run === run; });
      if (!group.length) return;

      group.sort(function (a, b) {
        var ta = rowTime(a), tb = rowTime(b);
        if (ta !== tb) return ta < tb ? -1 : 1;
        return Number(a.slot || 0) - Number(b.slot || 0);
      });

      var section = document.createElement('section');
      section.className = 'group';

      var heading = document.createElement('h2');
      heading.className = 'group-title';
      heading.textContent = run;
      section.appendChild(heading);

      group.forEach(function (r) { section.appendChild(buildCard(r)); });
      els.list.appendChild(section);
    });
  }

  /* ---------- data ---------- */

  function load() {
    if (typeof Papa === 'undefined') {
      showError('Could not load the CSV parser. Check your connection and refresh.');
      els.count.textContent = '—';
      return;
    }

    els.refresh.disabled = true;

    fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (csv) {
        var parsed = Papa.parse(csv, { header: true, skipEmptyLines: true });

        var next = [];
        (parsed.data || []).forEach(function (raw) {
          var row = normalise(raw);
          if (row) next.push(row);
        });

        rows = next;

        var seen = {};
        dates = [];
        rows.forEach(function (r) {
          if (!seen[r.date]) { seen[r.date] = true; dates.push(r.date); }
        });
        dates.sort();

        // Default view is today; if today has nothing yet, the latest day.
        if (!userPicked || dates.indexOf(selectedDate) === -1) {
          var today = todayISO();
          selectedDate = dates.indexOf(today) > -1
            ? today
            : (dates.length ? dates[dates.length - 1] : today);
        }

        clearError();
        render();
        stamp();
      })
      .catch(function (err) {
        showError('Could not load notifications-log.csv (' + err.message + ').');
        if (!rows.length) { els.count.textContent = '—'; render(); }
      })
      .then(function () { els.refresh.disabled = false; });
  }

  /* ---------- wiring ---------- */

  function wireChips(id, key) {
    var group = document.getElementById(id);
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('.chip');
      if (!btn) return;
      filters[key] = btn.getAttribute('data-value');
      Array.prototype.forEach.call(group.querySelectorAll('.chip'), function (c) {
        c.setAttribute('aria-pressed', String(c === btn));
      });
      render();
    });
  }

  function step(delta) {
    var i = dates.indexOf(selectedDate);
    if (i < 0) return;
    var j = i + delta;
    if (j < 0 || j >= dates.length) return;
    selectedDate = dates[j];
    userPicked = true;
    render();
  }

  wireChips('filter-audience', 'audience');
  wireChips('filter-run', 'run');

  els.prev.addEventListener('click', function () { step(-1); });
  els.next.addEventListener('click', function () { step(1); });

  els.date.addEventListener('change', function () {
    if (!els.date.value) return;
    selectedDate = els.date.value;
    userPicked = true;
    render();
  });

  els.todayBtn.addEventListener('click', function () {
    selectedDate = todayISO();
    userPicked = true;
    render();
  });

  els.refresh.addEventListener('click', load);

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
